project:
  name: "AWD Farm Plot Validation"
  version: "1.0.0"
  standard: "VCS v5.0"

input:
  filename: "farms_kmlFile.kml"
  layer: "Layer #0"
  raw_dir: "/app/data/raw"
  interim_dir: "/app/data/interim"
  processed_dir: "/app/data/processed"
  outputs_dir: "/app/data/outputs"

crs:
  input_epsg: 4326
  working_epsg: 32643
  output_epsg: 4326

schema:
  unique_id_field: "Name"
  description_field: "Description"
  id_pattern: "^[0-9]+-[0-9]+-[A-Z]+-[0-9]+$"
  alternate_id_pattern: "^FAM[A-Z0-9]+$"

thresholds:
  # min/max area thresholds removed — awaiting AWD methodology
  # confirmation from Jibotosh on minimum plot size
  # Will be added back once confirmed
  overlap_area_pct: 0.01        # >1% = real overlap, <1% = digitization noise
  sliver_area_ha: 0.001         # 10 sqm — geometry artifact threshold
  centroid_distance_m: 2.0      # spatial duplicate detection radius

checks:
  geometry_validity: true
  self_intersection: true
  degenerate_geometry: true
  spatial_overlap: true
  locational_duplicate: true
  unique_id_duplicate: true
  area_threshold: false         # disabled — awaiting methodology confirmation

unique_id:
  field_name: "Name"
  primary_pattern: "^[0-9]+-[0-9]+-[A-Z]+-[0-9]+$"
  alternate_pattern: "^FAM[A-Z0-9]+$"

logging:
  level: "INFO"
  log_dir: "/app/logs"

database:
  host: "postgis"
  port: 5432
  name: "awd_validation"
  user: "awd_user"
  password: "awd_secure_pass"
  schema: "awd"
# ─────────────────────────────────────────────────────────────────────────────
# PHASE 2 — ELIGIBILITY CROSS-CHECK CONFIGURATION
# Add this block to the bottom of config/settings.yaml
# ─────────────────────────────────────────────────────────────────────────────

phase2:
  # Input: reads from Phase 1F valid_plots output
  input_source: "phase1f_valid"

  forest:
    enabled: true
    definition_source: "maharashtra_fsi"
    layer_path: "/app/data/raw/forest_maharashtra_rfa.gpkg"
    attribute_field: "st_name"
    hansen_layer_path: "/app/data/raw/forest_hansen_canopy.gpkg"
    hansen_enabled: true
    # CDM DNA fallback thresholds (UNFCCC default)
    cdm_canopy_pct: 10
    cdm_height_m: 5
    cdm_min_area_ha: 1.0

  water_bodies:
    enabled: true
    layer_path: "/app/data/raw/water_bodies.gpkg"
    min_area_ha: 0.5                  # Only permanent water bodies > 0.5 ha

  infrastructure:
    enabled: true
    roads_layer_path: "/app/data/raw/roads.gpkg"
    roads_buffer_m: 5                 # 5m buffer around road centrelines
    railways_layer_path: "/app/data/raw/railways.gpkg"
    railways_buffer_m: 10             # 10m buffer around railway centrelines
    settlements_layer_path: "/app/data/raw/settlements.gpkg"
    settlements_buffer_m: 0           # Direct intersection, no buffer
    buildings_layer_path: "/app/data/raw/buildings.gpkg"
    buildings_buffer_m: 0             # Direct intersection, no buffer

  eligibility:
    # PENDING — awaiting Jibotosh confirmation on minimum % to retain a plot
    partial_threshold_pct: null
    # Flag plots losing more than 25% of area for manual review
    review_threshold_pct: 75
    # Carbon adjustment factor precision
    adjustment_factor_decimals: 4
